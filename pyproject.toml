[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "takemeout"
version = "0.1.0"
description = "A small encrypted VPN with a terminal dashboard"
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[project.scripts]
takemeout = "takemeout.cli:main"

[tool.setuptools]
packages = ["takemeout"]
